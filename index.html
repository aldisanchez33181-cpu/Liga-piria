function cid(g,f,i){ return `${g}_F${f}_${i}`; }

function calcTabla(gid, res) {
const tabla = {};
GRUPOS[gid].cruces[0].forEach(([p1,p2]) => { tabla[p1]={PJ:0,PG:0,PP:0,PTS:0}; tabla[p2]={PJ:0,PG:0,PP:0,PTS:0}; });
GRUPOS[gid].cruces.forEach((ronda,fi) => {
ronda.forEach(([p1,p2],ci) => {
const r = res[cid(gid,fi+1,ci)];
if(r && r.resultado && r.resultado.trim() && r.ganador) {
tabla[p1].PJ++; tabla[p2].PJ++;
if(r.ganador===“p1”){ tabla[p1].PG++; tabla[p1].PTS++; tabla[p2].PP++; }
else { tabla[p2].PG++; tabla[p2].PTS++; tabla[p1].PP++; }
}
});
});
return Object.entries(tabla).map(([p,s])=>({p,…s})).sort((a,b)=>b.PTS-a.PTS||b.PG-a.PG);
}

function getProximos(res) {
const lista = [];
Object.entries(GRUPOS).forEach(([gid,g]) => {
g.cruces.forEach((ronda,fi) => {
ronda.forEach(([p1,p2],ci) => {
const k = cid(gid,fi+1,ci);
const d = res[k]||{};
const jugado = !!(d.resultado && d.resultado.trim() && d.ganador);
if(d.fecha && !jugado) {
lista.push({gid, color:g.color, label:g.label, fecha:d.fecha, hora:d.hora, cancha:d.cancha, p1, p2, fi:fi+1});
}
});
});
});
return lista.sort((a,b) => {
if(a.fecha < b.fecha) return -1;
if(a.fecha > b.fecha) return 1;
if(a.hora < b.hora) return -1;
if(a.hora > b.hora) return 1;
return 0;
});
}

function Avisos({ avisos, isAdmin, onSave }) {
const [nuevo, setNuevo] = React.useState(””);
const [editIdx, setEditIdx] = React.useState(null);
const [editTxt, setEditTxt] = React.useState(””);

const agregar = () => {
if(!nuevo.trim()) return;
const fecha = new Date().toLocaleDateString(“es-UY”);
onSave([{texto:nuevo.trim(), fecha}, …avisos]);
setNuevo(””);
};
const borrar = (i) => onSave(avisos.filter((_,idx)=>idx!==i));
const guardarEdit = (i) => { const a=[…avisos]; a[i]={…a[i],texto:editTxt}; onSave(a); setEditIdx(null); };

return (
<div>
{isAdmin && (
<div style={{background:card,border:`1px solid #7c3aed44`,borderRadius:“12px”,padding:“1rem”,marginBottom:“1.2rem”}}>

<textarea value={nuevo} onChange={e=>setNuevo(e.target.value)} placeholder=“Escribí un aviso para los jugadores…”
style={{…inp,minHeight:“80px”,resize:“vertical”,marginBottom:“0.75rem”}}/>
<button onClick={agregar} style={{…btn(”#7c3aed”),width:“100%”,padding:“0.7rem”}}>📢 PUBLICAR AVISO</button>
</div>
)}
{avisos.length===0 ? (
<div style={{textAlign:“center”,padding:“2rem”,color:muted,fontSize:“0.85rem”}}>No hay avisos publicados.</div>
) : (
<div style={{display:“flex”,flexDirection:“column”,gap:“0.75rem”}}>
{avisos.map((a,i)=>(
<div key={i} style={{background:card,border:`1px solid ${border}`,borderRadius:“12px”,padding:“1rem”}}>
<div style={{display:“flex”,justifyContent:“space-between”,alignItems:“flex-start”,marginBottom:“0.4rem”}}>
<span style={{fontSize:“0.65rem”,color:muted,fontFamily:”‘Barlow Condensed’,sans-serif”,letterSpacing:“1px”}}>📅 {a.fecha}</span>
{isAdmin && (
<div style={{display:“flex”,gap:“0.4rem”}}>
<button onClick={()=>{setEditIdx(i);setEditTxt(a.texto);}} style={{background:“none”,border:“none”,color:muted,cursor:“pointer”,fontSize:“0.8rem”}}>✏️</button>

function Login({ onLogin }) {
const [step, setStep] = React.useState(“choose”);
const [pin, setPin] = React.useState(””);
const [pin2, setPin2] = React.useState(””);
const [stored, setStored] = React.useState(null);
const [err, setErr] = React.useState(””);

const goAdmin = () => {
const r = storage.get(PIN_KEY);
if(r){ setStored(r.value); setStep(“enter”); } else setStep(“setup”);
};
const setup = () => {
if(pin.length<4){setErr(“Mínimo 4 caracteres”);return;}
if(pin!==pin2){setErr(“No coinciden”);return;}
storage.set(PIN_KEY,pin); onLogin(true);
};
const enter = () => {
if(pin===stored) onLogin(true);
else { setErr(“Contraseña incorrecta”); setPin(””); }
};

return (
<div style={{minHeight:“100vh”,background:bg,display:“flex”,alignItems:“center”,justifyContent:“center”,padding:“1rem”,backgroundImage:“radial-gradient(ellipse at 30% 40%, #0c1f3f 0%, transparent 60%)”}}>
<div style={{textAlign:“center”,width:“100%”,maxWidth:“320px”}}>
<img src={LOGO} alt=“Logo” onError={e=>e.target.style.display=“none”} style={{width:“150px”,height:“150px”,objectFit:“contain”,margin:“0 auto 0.5rem”,display:“block”}}/>

{step===“choose”&&<>
<p style={{color:muted,fontSize:“0.8rem”,marginBottom:“1.2rem”}}>¿Cómo querés ingresar?</p>
<button onClick={()=>onLogin(false)} style={{…btn(”#1d4ed8”),width:“100%”,padding:“0.85rem”,marginBottom:“0.75rem”,letterSpacing:“2px”}}>👀 VER LA LIGA</button>
<button onClick={goAdmin} style={{…btn(”#7c3aed”),width:“100%”,padding:“0.85rem”,letterSpacing:“2px”}}>🔑 ACCESO ADMIN</button>
<p style={{color:muted,fontSize:“0.68rem”,marginTop:“1rem”}}>Solo Felipe puede cargar fechas y resultados.</p>
</>}
{step===“setup”&&<>
<div style={{color:”#a78bfa”,fontSize:“0.72rem”,letterSpacing:“2px”,marginBottom:“1rem”}}>🔑 CREÁ TU CONTRASEÑA</div>
<label style={{…lbl,textAlign:“left”,display:“block”,marginBottom:“0.3rem”}}>CONTRASEÑA</label>
<input type=“password” placeholder=“Mínimo 4 caracteres” value={pin} onChange={e=>{setPin(e.target.value);setErr(””);}} style={{…inp,marginBottom:“0.75rem”}}/>
<label style={{…lbl,textAlign:“left”,display:“block”,marginBottom:“0.3rem”}}>CONFIRMAR</label>
<input type=“password” placeholder=“Repetí” value={pin2} onChange={e=>{setPin2(e.target.value);setErr(””);}} onKeyDown={e=>e.key===“Enter”&&setup()} style={{…inp,marginBottom:“0.75rem”}}/>
{err&&<div style={{color:”#f87171”,fontSize:“0.78rem”,marginBottom:“0.75rem”}}>{err}</div>}
<button onClick={setup} style={{…btn(”#7c3aed”),width:“100%”,padding:“0.8rem”}}>CREAR</button>
</>}
{step===“enter”&&<>
<div style={{color:”#a78bfa”,fontSize:“0.72rem”,letterSpacing:“2px”,marginBottom:“1rem”}}>🔑 ACCESO ADMIN</div>

</>}
</div>
</div>
