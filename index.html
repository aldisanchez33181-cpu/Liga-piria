const bg="#06090f",card="#0c1220",border="#1a2840",text="#dbeafe",muted="#4a6fa5";
function cid(g,f,i){return `${g}_F${f}_${i}`;}
function fmtFecha(f){return f?f.split("-").reverse().join("/"):"";}

function calcSets(resultado, ganador){
  // resultado ej: "6-3 / 4-6 / 6-4"
  // retorna {setsP1, setsP2}
  if(!resultado||!resultado.trim())return{setsP1:0,setsP2:0};
  let setsP1=0,setsP2=0;
  const sets=resultado.split("/").map(s=>s.trim());
  sets.forEach(s=>{
    const partes=s.split("-").map(x=>parseInt(x.trim()));
    if(partes.length===2&&!isNaN(partes[0])&&!isNaN(partes[1])){
      if(partes[0]>partes[1])setsP1++;
      else if(partes[1]>partes[0])setsP2++;
    }
  });
  return{setsP1,setsP2};
}

function calcTabla(gid){
  const t={};
  GRUPOS[gid].cruces[0].forEach(([p1,p2])=>{t[p1]={PJ:0,PG:0,PP:0,PTS:0};t[p2]={PJ:0,PG:0,PP:0,PTS:0};});
  GRUPOS[gid].cruces.forEach((ronda,fi)=>{
    ronda.forEach(([p1,p2],ci)=>{
      const r=STATE.res[cid(gid,fi+1,ci)];
      if(r&&r.resultado&&r.resultado.trim()&&r.ganador){
        t[p1].PJ++;t[p2].PJ++;
        const {setsP1,setsP2}=calcSets(r.resultado,r.ganador);
        if(r.ganador==="p1"){
          t[p1].PG++;t[p2].PP++;
          t[p1].PTS+=setsP1;
          t[p2].PTS+=setsP2;
        } else {
          t[p2].PG++;t[p1].PP++;
          t[p2].PTS+=setsP2;
          t[p1].PTS+=setsP1;
        }
      }
    });
  });
  return Object.entries(t).map(([p,s])=>({p,...s})).sort((a,b)=>b.PTS-a.PTS||b.PG-a.PG);
}

function getProximos(){
  const lista=[];
  Object.entries(GRUPOS).forEach(([gid,g])=>{
    g.cruces.forEach((ronda,fi)=>{
      ronda.forEach(([p1,p2],ci)=>{
        const k=cid(gid,fi+1,ci);
        const d=STATE.res[k]||{};
        const jugado=!!(d.resultado&&d.resultado.trim()&&d.ganador);
        if(d.fecha&&!jugado)lista.push({gid,color:g.color,label:g.label,fecha:d.fecha,hora:d.hora,cancha:d.cancha,p1,p2,fi:fi+1});
      });
    });
  });
  return lista.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
}

function h(tag,attrs,children){
  const el=document.createElement(tag);
  Object.entries(attrs||{}).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k.startsWith("on"))el[k]=v;
    else el.setAttribute(k,v);
  });
  (children||[]).forEach(c=>{
    if(!c)return;
    if(typeof c==="string")el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  });
  return el;
}

  const {seccion,gid,fecha,tab,res,avisos,admin,modal}=STATE;
  const g=GRUPOS[gid];
  const proximos=getProximos();

  // Header

  const title=h("div",{},[
    h("div",{class:"bc",style:{fontSize:"1.15rem",letterSpacing:"3px",fontWeight:800,lineHeight:1}},["LIGA PIRIA PÁDEL"]),

  ]);
  const adminBadge=admin?h("span",{class:"bc",style:{background:"#7c3aed22",border:"1px solid #7c3aed",color:"#a78bfa",padding:"2px 8px",borderRadius:"10px",fontSize:".65rem"}},["🔑 ADMIN"]):null;
  const salirBtn=h("button",{style:{background:"none",border:`1px solid ${border}`,color:muted,padding:".2rem .5rem",borderRadius:"6px",cursor:"pointer",fontSize:".68rem"},onclick:()=>setState({loggedIn:false,admin:false,loginStep:"choose",pin:""})},[" Salir"]);
  const header=h("header",{style:{background:`${card}ee`,borderBottom:`1px solid ${border}`,padding:".8rem 1rem",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}},[
    h("div",{style:{display:"flex",alignItems:"center",gap:".6rem"}},[logoH,title]),

  // Nav tabs
  const SECS=[
    {id:"inicio",label:"🏠 INICIO"},
    {id:"proximos",label:`📅 PRÓXIMOS${proximos.length>0?" ("+proximos.length+")":""}`},
    {id:"grupos",label:"🎾 GRUPOS"},
    {id:"avisos",label:`📢 AVISOS${avisos.length>0?" ("+avisos.length+")":""}`},
  ];
  const nav=h("div",{style:{background:card,borderBottom:`1px solid ${border}`,display:"flex",overflowX:"auto"}},
    SECS.map(s=>h("button",{style:{background:"none",border:"none",padding:".9rem 1rem",cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:".82rem",letterSpacing:"1px",color:seccion===s.id?"#dbeafe":muted,borderBottom:seccion===s.id?"3px solid #3b82f6":"3px solid transparent",whiteSpace:"nowrap"},onclick:()=>setState({seccion:s.id})},[s.label]))
  );

  // Content
  let content;

  if(seccion==="inicio"){
    const logoB=h("img",{src:LOGO,onerror:"this.style.display='none'",style:{width:"120px",height:"120px",objectFit:"contain",display:"block",margin:"0 auto 1rem"}});
    const stats=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:".75rem",maxWidth:"500px",margin:"0 auto"}},
      [["3","GRUPOS"],["24","PAREJAS"],["7","FECHAS"],["23 MAY","GRAN FINAL"]].map(([n,l])=>
        h("div",{class:"card",style:{padding:"1rem",textAlign:"center"}},[
          h("div",{class:"bc",style:{fontSize:"1.8rem",fontWeight:800,color:"#3b82f6"}},[n]),
          h("div",{class:"bc",style:{color:muted,fontSize:".72rem",letterSpacing:"2px"}},[l]),
        ])
      )
    );
    const hero=h("div",{style:{textAlign:"center",padding:"2rem 1rem",marginBottom:"1.5rem"}},[
      logoB,
      h("div",{class:"bc",style:{fontSize:"2rem",fontWeight:800,letterSpacing:"4px",marginBottom:".3rem"}},["LIGA PIRIA PÁDEL"]),
      h("div",{class:"bc",style:{color:muted,letterSpacing:"3px",fontSize:".8rem",marginBottom:"1.5rem"}},["TEMPORADA MARZO — MAYO 2026"]),
      stats,
    ]);

    const avisosSection=avisos.length>0?h("div",{style:{marginBottom:"1.5rem"}},[
      h("div",{class:"bc",style:{fontSize:"1rem",letterSpacing:"3px",color:"#a78bfa",marginBottom:".75rem"}},["📢 ÚLTIMOS AVISOS"]),
      ...avisos.slice(0,2).map(a=>h("div",{class:"card",style:{marginBottom:".5rem",border:"1px solid #7c3aed33"}},[
        h("div",{style:{fontSize:".65rem",color:muted,marginBottom:".3rem"}},[`📅 ${a.fecha}`]),
        h("div",{style:{color:text,fontSize:".85rem"}},[a.texto]),
      ])),
    ]):null;

    const proximosSection=proximos.length>0?h("div",{},[
      h("div",{class:"bc",style:{fontSize:"1rem",letterSpacing:"3px",color:"#dbeafe",marginBottom:".75rem"}},["📅 PRÓXIMOS PARTIDOS"]),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:".75rem"}},
        proximos.slice(0,4).map(p=>h("div",{class:"card",style:{border:`1px solid ${p.color}44`}},[
          h("div",{class:"bc",style:{fontSize:".65rem",color:p.color,marginBottom:".4rem"}},[`${p.label} · FECHA ${p.fi}`]),
          h("div",{style:{fontSize:".85rem",lineHeight:1.5,marginBottom:".5rem"}},[
            h("strong",{},[p.p1])," ",h("span",{style:{color:p.color}},["vs"])," ",h("strong",{},[p.p2])
          ]),
          h("div",{style:{fontSize:".75rem",color:muted}},[`📅 ${fmtFecha(p.fecha)} · 🕐 ${p.hora} · 🎾 ${(p.cancha||"").replace("Cancha ","C")}`]),
        ]))
      ),
    ]):null;

    content=h("div",{},[hero,avisosSection,proximosSection].filter(Boolean));
  }

  else if(seccion==="proximos"){
    const lista=proximos;
    const cards=lista.length===0
      ?h("div",{style:{textAlign:"center",padding:"2rem",color:muted}},["No hay partidos agendados todavía."])
      :h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:".9rem"}},
        lista.map(p=>h("div",{class:"card",style:{border:`1px solid ${p.color}44`}},[
          h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:".6rem"}},[
            h("span",{class:"bc",style:{fontSize:".65rem",background:p.color+"22",color:p.color,padding:"2px 8px",borderRadius:"10px"}},[p.label]),
            h("span",{class:"bc",style:{fontSize:".65rem",color:muted}},["FECHA "+p.fi]),
          ]),
          h("div",{style:{fontSize:".88rem",lineHeight:1.6,marginBottom:".6rem"}},[h("strong",{},[p.p1]),h("br"),h("span",{class:"bc",style:{color:p.color,fontSize:".7rem",letterSpacing:"3px"}},["VS"]),h("br"),h("strong",{},[p.p2])]),
          h("div",{style:{paddingTop:".6rem",borderTop:`1px solid ${border}`,fontSize:".78rem",color:muted}},[`📅 ${fmtFecha(p.fecha)} · 🕐 ${p.hora} · 🎾 ${(p.cancha||"").replace("Cancha ","C")}`]),
        ]))
      );
    content=h("div",{},[
      h("div",{style:{display:"flex",alignItems:"center",gap:".75rem",marginBottom:"1.2rem"}},[
        h("div",{style:{width:"4px",height:"32px",background:"#3b82f6",borderRadius:"2px"}}),
        h("div",{},[
          h("h2",{class:"bc",style:{fontSize:"1.4rem",letterSpacing:"3px",fontWeight:700}},["PRÓXIMOS PARTIDOS"]),
          h("div",{style:{color:muted,fontSize:".75rem"}},["Todos los partidos agendados ordenados por fecha"]),
        ]),
      ]),
      cards,
    ]);
  }

  else if(seccion==="grupos"){
    const gTabs=h("div",{style:{background:card,display:"flex",overflowX:"auto",marginBottom:"1.2rem",borderRadius:"10px"}},
      Object.entries(GRUPOS).map(([id,gr])=>h("button",{style:{background:"none",border:"none",padding:".8rem 1rem",cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:".82rem",letterSpacing:"1.5px",color:gid===id?gr.color:muted,borderBottom:gid===id?`3px solid ${gr.color}`:"3px solid transparent",whiteSpace:"nowrap"},onclick:()=>setState({gid:id,fecha:1,tab:"cruces"})},[(id==="G+7"?"🟡":id==="G1+11"?"🔵":"🟢")+" "+gr.label]))
    );

    // subtabs
    const subTabs=h("div",{style:{display:"flex",borderBottom:`1px solid ${border}`,marginBottom:"1.5rem"}},[
      h("button",{style:{background:"none",border:"none",padding:".75rem 1.2rem",cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:".9rem",letterSpacing:"2px",color:tab==="cruces"?g.color:muted,borderBottom:tab==="cruces"?`2px solid ${g.color}`:"2px solid transparent"},onclick:()=>setState({tab:"cruces"})},["📅 CRUCES"]),
      h("button",{style:{background:"none",border:"none",padding:".75rem 1.2rem",cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:".9rem",letterSpacing:"2px",color:tab==="tabla"?g.color:muted,borderBottom:tab==="tabla"?`2px solid ${g.color}`:"2px solid transparent"},onclick:()=>setState({tab:"tabla"})},["🏆 TABLA"]),
    ]);

    let tabContent;
    if(tab==="tabla"){
      const rows=calcTabla(gid);
      tabContent=h("div",{style:{overflowX:"auto"}},[
        h("table",{style:{width:"100%",borderCollapse:"collapse",minWidth:"360px"}},[
          h("thead",{},[h("tr",{},["#","PAREJA","PJ","PG","PP","PTS"].map(hd=>h("th",{style:{padding:".5rem .6rem",textAlign:hd==="PAREJA"?"left":"center",fontFamily:"'Barlow Condensed',sans-serif",fontSize:".72rem",letterSpacing:"2px",color:muted,borderBottom:`1px solid ${border}`}},[hd])))]),
          h("tbody",{},rows.map(({p,PJ,PG,PP,PTS},i)=>h("tr",{style:{borderBottom:`1px solid ${border}22`,background:i===0?g.color+"22":i===1?g.color+"11":"transparent"}},[
            h("td",{style:{padding:".5rem .6rem",textAlign:"center",color:i<2?g.color:muted,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:"1.1rem"}},[i===0?"🥇":i===1?"🥈":String(i+1)]),
            h("td",{style:{padding:".5rem .6rem",color:i<2?text:muted,fontSize:".82rem",fontWeight:i<2?"700":"400"}},[p+(i<2?" ✓":"")]),
            h("td",{style:{padding:".5rem .6rem",textAlign:"center",color:muted,fontSize:".82rem"}},[String(PJ)]),
            h("td",{style:{padding:".5rem .6rem",textAlign:"center",color:"#4ade80",fontSize:".82rem"}},[String(PG)]),
            h("td",{style:{padding:".5rem .6rem",textAlign:"center",color:"#f87171",fontSize:".82rem"}},[String(PP)]),
            h("td",{style:{padding:".5rem .6rem",textAlign:"center",fontFamily:"'Barlow Condensed',sans-serif",fontSize:"1.1rem",fontWeight:700,color:g.color}},[String(PTS)]),
          ]))),
        ]),
        h("div",{style:{marginTop:".75rem",fontSize:".7rem",color:muted,fontFamily:"'Barlow Condensed',sans-serif"}},["🏆 Los 2 primeros clasifican a la Gran Final"]),
      ]);
    } else {
      const fBtns=h("div",{style:{display:"flex",gap:".4rem",flexWrap:"wrap",marginBottom:"1.2rem"}},
        g.cruces.map((_,i)=>h("button",{style:{background:fecha===i+1?g.color:card,color:fecha===i+1?"white":muted,border:`1px solid ${fecha===i+1?g.color:border}`,padding:".3rem .8rem",borderRadius:"20px",cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontSize:".82rem"},onclick:()=>setState({fecha:i+1})},["F"+(i+1)]))
      );
      const cards=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:".9rem"}},
        g.cruces[fecha-1].map(([p1,p2],ci)=>{
          const k=cid(gid,fecha,ci);
          const d=res[k]||{};
          const jugado=!!(d.resultado&&d.resultado.trim()&&d.ganador);
          const agendado=!!d.fecha&&!jugado;
          const card2=h("div",{style:{background:card,border:`1px solid ${jugado?g.color+"88":agendado?g.color+"44":border}`,borderRadius:"12px",padding:"1rem",cursor:admin?"pointer":"default",transition:"transform .15s"}},[
            h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:".6rem"}},[
              h("span",{class:"bc",style:{fontSize:".72rem",letterSpacing:"2px",color:muted}},["FECHA "+fecha]),
              h("span",{class:"bc",style:{fontSize:".62rem",background:jugado?g.color:agendado?g.color+"33":border,color:jugado?"white":agendado?g.color:muted,padding:"2px 8px",borderRadius:"10px"}},[jugado?"✓ JUGADO":agendado?"📅 AGENDADO":"SIN FECHA"]),
            ]),
            h("div",{style:{fontSize:".88rem",lineHeight:1.6}},[
              h("div",{style:{fontWeight:600,color:d.ganador==="p1"?g.color:text}},[p1]),
              h("div",{class:"bc",style:{color:g.color,fontSize:".7rem",letterSpacing:"3px",margin:"2px 0"}},["VS"]),
              h("div",{style:{fontWeight:600,color:d.ganador==="p2"?g.color:text}},[p2]),
            ]),
            agendado?h("div",{style:{marginTop:".6rem",paddingTop:".6rem",borderTop:`1px solid ${border}`,fontSize:".78rem",color:muted}},[`📅 ${fmtFecha(d.fecha)} · 🕐 ${d.hora} · 🎾 ${(d.cancha||"").replace("Cancha ","C")}`]):null,
            jugado?h("div",{class:"bc",style:{marginTop:".4rem",fontSize:".82rem",color:g.color}},[d.resultado]):null,
            admin?h("div",{class:"bc",style:{marginTop:".5rem",fontSize:".68rem",color:muted}},["✏️ Tocá para editar"]):null,
          ].filter(Boolean));
          if(admin)card2.onclick=()=>setState({modal:{p1,p2,k,gid}});
          if(admin){card2.onmouseenter=()=>card2.style.transform="translateY(-2px)";card2.onmouseleave=()=>card2.style.transform="translateY(0)";}
          return card2;
        })
      );
      tabContent=h("div",{},[fBtns,cards]);
    }

    const readNote=!admin?h("div",{style:{background:"#1a284088",border:`1px solid ${border}`,borderRadius:"10px",padding:".6rem 1rem",marginBottom:"1rem",fontSize:".78rem",color:muted}},["👁 Modo lectura — Solo Felipe puede cargar fechas y resultados."]):null;
    content=h("div",{},[gTabs,h("div",{style:{display:"flex",alignItems:"center",gap:".75rem",marginBottom:"1.2rem"}},[h("div",{style:{width:"4px",height:"32px",background:g.color,borderRadius:"2px"}}),h("div",{},[h("h2",{class:"bc",style:{fontSize:"1.4rem",letterSpacing:"3px",fontWeight:700}},[g.label.toUpperCase()]),h("div",{style:{color:muted,fontSize:".75rem"}},["8 parejas · 7 fechas · Final 23 de Mayo"])])]),readNote,subTabs,tabContent].filter(Boolean));
  }

  else if(seccion==="avisos"){
    let avisoContent=[];
    if(admin){
      const ta=h("textarea",{class:"inp",placeholder:"Escribí un aviso para los jugadores...",style:{minHeight:"80px",resize:"vertical",marginBottom:".75rem"}});
      const pubBtn=h("button",{class:"btn",style:{background:"#7c3aed",width:"100%",padding:".7rem"},onclick:()=>{
        if(!ta.value.trim())return;
        const fecha=new Date().toLocaleDateString("es-UY");
        saveAvisos([{texto:ta.value.trim(),fecha},...STATE.avisos]);
        ta.value="";
      }},["📢 PUBLICAR AVISO"]);
      avisoContent.push(h("div",{class:"card",style:{border:"1px solid #7c3aed44",marginBottom:"1.2rem"}},[
        h("label",{class:"lbl",style:{color:"#a78bfa",marginBottom:".5rem"}},["NUEVO AVISO"]),ta,pubBtn
      ]));
    }
    if(avisos.length===0){
      avisoContent.push(h("div",{style:{textAlign:"center",padding:"2rem",color:muted}},["No hay avisos publicados."]));
    } else {
      avisos.forEach((a,i)=>{
        const borrar=h("button",{style:{background:"none",border:"none",color:"#f87171",cursor:"pointer",fontSize:".8rem"},onclick:()=>saveAvisos(avisos.filter((_,idx)=>idx!==i))},["🗑️"]);
        const card3=h("div",{class:"card",style:{marginBottom:".75rem"}},[
          h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:".4rem"}},[
            h("span",{class:"bc",style:{fontSize:".65rem",color:muted,letterSpacing:"1px"}},[`📅 ${a.fecha}`]),
            admin?borrar:null,
          ].filter(Boolean)),
          h("div",{style:{color:text,fontSize:".88rem",lineHeight:1.6,whiteSpace:"pre-wrap"}},[a.texto]),
        ]);
        avisoContent.push(card3);
      });
    }
    content=h("div",{},[
      h("div",{style:{display:"flex",alignItems:"center",gap:".75rem",marginBottom:"1.2rem"}},[
        h("div",{style:{width:"4px",height:"32px",background:"#a78bfa",borderRadius:"2px"}}),
        h("div",{},[h("h2",{class:"bc",style:{fontSize:"1.4rem",letterSpacing:"3px",fontWeight:700}},["TABLÓN DE AVISOS"]),h("div",{style:{color:muted,fontSize:".75rem"}},["Comunicados y novedades de la liga"])]),
      ]),
      ...avisoContent,
    ]);
  }

  const main=h("div",{style:{padding:"1.2rem",maxWidth:"1100px",margin:"0 auto"}},[content]);
  const footer=h("div",{class:"bc",style:{textAlign:"center",padding:"1.5rem",color:muted,fontSize:".72rem",letterSpacing:"2px"}},["⭐ GRAN FINAL — 23 DE MAYO DE 2026 ⭐"]);
  const modalEl=renderModal();

  const page=h("div",{style:{minHeight:"100vh"}},[header,nav,main,footer,modalEl].filter(Boolean));
  return page;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  if(!STATE.loggedIn){app.appendChild(renderLogin());}
  else{app.appendChild(renderApp());}
}

// ── Init ──────────────────────────────────────────────
async function init(){
  // Escuchar Firebase en tiempo real
  fbListen("resultados",val=>{try{STATE.res=JSON.parse(val);render();}catch{}});
  fbListen("avisos",val=>{try{STATE.avisos=JSON.parse(val);render();}catch{}});

  // Cargar datos iniciales
  const [r,a]=await Promise.all([fbGet("resultados"),fbGet("avisos")]);
  if(r)try{STATE.res=JSON.parse(r);}catch{}
  if(a)try{STATE.avisos=JSON.parse(a);}catch{}

  document.getElementById("loading").style.display="none";
  document.getElementById("app").classList.remove("hidden");
  render();
}

init();
</script>
